name = "open-services-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
SESSION_TTL_DAYS = "30"
PBKDF2_ITERATIONS = "100000"
# Allowed browser origins for the API. Narrow this to the deployed Pages
# origin (for example "https://open-services.pages.dev") once the web build
# lives on Cloudflare Pages. "*" keeps native builds and any web host working.
APP_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "open-services"
# Your own D1 database. Create one with
#   npx wrangler d1 create open-services
# and put the id it prints here. Locally this id only names the SQLite file
# in worker/.wrangler, so any value works for development.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]

[triggers]
crons = ["17 * * * *"]
