name = "open-services-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
SESSION_TTL_DAYS = "30"
PBKDF2_ITERATIONS = "100000"
# Set to "false" to close self-service registration on this deployment.
ALLOW_SIGNUP = "true"
# Allowed browser origins for the API. Narrow this to the deployed Pages
# origin (for example "https://open-services.pages.dev") once the web build
# lives on Cloudflare Pages. "*" keeps native builds and any web host working.
APP_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "open-services"
database_id = "806dc9ab-457f-4f6e-b58b-5673ade639a0"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "USER_HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]

[triggers]
crons = ["17 * * * *"]
